[build-system]
requires = ["setuptools","wheel","numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "snpy"
dynamic = ["version"]
authors = [
    {name="Chris Burns", email="cburns@carnegiescience.edu"},
]
description = "SNooPy:  Supernova light-curve analysis tool"
readme = "README.rst"
requires-python = ">=3.9"
keywords = ["astronomy","supernova","science"]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: IPython",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
    "h5py",
    "onnxruntime",
    "emcee",
    "pymysql",
    "scikit-learn",
    "extinction",
    "sfdmap2"]

[project.optional-dependencies]
test = ["pytest"]
interactive = ["ipython"]


[tool.setuptools]
packages = ["snpy","snpy.CSPtemp","snpy.SwiftTemp","snpy.dm15temp",
            "snpy.filters","snpy.spline2","snpy.sqlmod","snpy.utils"]

[tool.setuptools.dynamic]
version = {attr = "snpy.version.__version__"}

[tool.setuptools.package-data]
"snpy.CSPtemp" = ["fits/*.fits"]
"snpy.dm15temp" = ["*.pickle"]
"snpy.utils" = ["*.pickle"]
"snpy.filters" = ["filters/*/*/*","standards/*/*"]
